- target: $.info
  update:
    description: >-
      Programmatic freight quoting and booking for iContainers. Create an FCL, LCL, air or LTL quote, read
      its rates, price a rate with the services you want, book it, then poll the booking for status and
      track-and-trace, and exchange documents. All operations require a JWT bearer token issued by
      iContainers (contact devsupport@icontainers.com — there is no self-serve signup). The API returns
      X-RateLimit-Limit/X-RateLimit-Remaining headers with a measured ceiling of 60 requests per 60 seconds.
      Booking is asynchronous and has no idempotency key: a retried POST /api/v1/rates/{rateUuid}/book may
      create a duplicate booking.

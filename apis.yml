apis:
- name: iContainers Brutus API
  description: >-
    The Brutus API is iContainers' published REST contract for programmatic freight quoting and booking. It exposes
    quote creation for FCL, LCL, air and LTL shipments, quote retrieval by UUID, price calculation for a returned rate,
    maritime and aerial place/port search, booking a rate, retrieving booking details, booking track-and-trace, and
    uploading/downloading booking documents. All operations require a JWT bearer token; validation failures return a
    Laravel-style envelope with a `message` string and a per-field `errors` object.
  humanURL: https://developer.icontainers.com/
  baseURL: https://brutus.icontainers.com

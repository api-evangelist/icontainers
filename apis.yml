aid: icontainers
name: iContainers
description: >-
  iContainers is a digital freight forwarder founded in 2007 in Barcelona and now part of Agility Logistics, following
  its 2019/2022 merger with Shipa Freight. The platform lets SMEs, importers/exporters, moving companies, freight agents
  and individuals search, compare, book, insure, document and track international ocean freight (FCL and LCL), air
  freight, air express and customs clearance across 250,000+ trade routes to 300+ destinations. Developer access is
  published as the "Brutus API" — an OpenAPI 3.0.0 contract rendered on developer.icontainers.com covering FCL/LCL/air/LTL
  quoting, rate price calculation, place/port search, booking a rate, booking track-and-trace, and booking document
  upload/download — secured with JWT bearer tokens. iContainers also sells a white-label freight forwarding portal, and
  its operational layer is supplied by the third-party platform VelocityOS.ai.

note: >-
  Derived from the 4xx/5xx responses declared on all 15 Brutus API operations. The API does NOT use RFC
  9457 problem+json: only the 422 carries a schema, and that schema is the Laravel validation envelope
  (`message` string + `errors` object keyed by field name, each value an array of message strings). The
  401, 403, 404 and 500 responses declare a description but NO media type and NO schema, so a client
  cannot know their body shape from the contract. An observed live 401 from
  https://brutus.icontainers.com returned `content-type: application/json` with an empty JSON object
  `{}` — no error code, no message, no type URI. No 429 is declared on any operation even though the API
  returns X-RateLimit-* headers (see rate-limits/icontainers-rate-limits.yml). iContainers publishes no
  error reference page to enrich these titles or remediation from.
envelope:
  validation:
    media_type: application/json
    schema: 422Response
    fields:
    - {name: message, type: string, example: The given data was invalid.}
    - {name: errors, type: object, description: 'map of field name -> array of message strings'}
    example_shape: '{"message":"The given data was invalid.","errors":{"someProperty":["The some property field is required."]}}'
  other_4xx_5xx:
    media_type: null
    schema: null
    observed_401_body: '{}'
    note: 'unschematized — 401/403/404/500 declare a description only'
